# XcodeGen spec for the ADDITIVE iOS 12 tier of the sora-legacy
# iOS client (LEGACY-FULL WS4). Generate with:
#   xcodegen generate --spec project-ios12.yml   (see BUILD-MAC.md §8)
#
# This spec is a variant of project.yml (the shipped iOS 13.0
# tier); project.yml is NOT modified by the tier. Deltas, all of
# them listed here and in Tiers/IOS12/TARGET-NOTES.md §4:
#   1. deploymentTarget iOS 12.0 (pin sing-box 1.11.15 built with
#      an explicit `-iosversion 12.0` — BUILD-MAC.md §8; the pin's
#      gomobile default is 13.0, so this tier exists only when the
#      flag is passed);
#   2. frameworks come from Frameworks/IOS12/ (the 1.11.15 Libbox
#      and the Mobileapi bound with `-iosversion 12.0`), never
#      from the 13.0 tier's Frameworks/;
#   3. App/StatusViewController.swift is excluded and replaced by
#      Tiers/IOS12/Replacements/StatusViewController.swift (two
#      iOS 13+ semantic colors gated with #available), and
#      PacketTunnel/LibboxBridgeImpl.swift is replaced by
#      Tiers/IOS12/Replacements/LibboxBridgeImpl.swift (the
#      1.11.15 libbox bridge: 16-method PlatformInterface,
#      package-level local-DNS registration — TARGET-NOTES §3);
#   4. the SoraLegacyCore package is consumed with its platform
#      floor lowered to .iOS(.v12) — a one-line change to
#      SoraLegacyCore/Package.swift made in the tier checkout per
#      BUILD-MAC.md §8 step 0 (the committed Package.swift keeps
#      .v13 for the shipped tier).
#
# Bundle IDs and the App Group are the same as the 13.0 tier: the
# tiers are alternative BUILDS of one product (a device runs one
# of them), not two products — unlike the main sora tree, whose
# legacy client is a separate product with its own IDs.
name: SoraLegacyIOS12
options:
  bundleIdPrefix: one.levvs.sora
  deploymentTarget:
    iOS: "12.0"
  createIntermediateGroups: true
packages:
  SoraLegacyCore:
    path: SoraLegacyCore
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "$(SORA_DEVELOPMENT_TEAM)"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "$(SORA_CODE_SIGN_IDENTITY)"
targets:
  SoraLegacy:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Assets/Media.xcassets
        excludes:
          - StatusViewController.swift
      - path: Tiers/IOS12/Replacements/StatusViewController.swift
    dependencies:
      - package: SoraLegacyCore
      - target: PacketTunnel
        embed: true
      - framework: Frameworks/IOS12/Libbox.xcframework
        embed: false
      - framework: Frameworks/IOS12/Mobileapi.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: one.levvs.sora.legacy
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: PacketTunnel
        excludes:
          - LibboxBridgeImpl.swift
      - path: Tiers/IOS12/Replacements/LibboxBridgeImpl.swift
    dependencies:
      - package: SoraLegacyCore
      - framework: Frameworks/IOS12/Libbox.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: one.levvs.sora.legacy.PacketTunnel
        INFOPLIST_FILE: PacketTunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: PacketTunnel/PacketTunnel.entitlements

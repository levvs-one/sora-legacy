name: Security

on:
  push:
    branches: [legacy]
  pull_request:
  schedule:
    # Four times a day, so a new advisory is noticed on the day it is published
    # rather than on the next commit.
    - cron: '17 */6 * * *'

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vulnerabilities:
    name: Vulnerable dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/go.mod
          cache: false

      # govulncheck reports what is reachable from the program, not what sits in
      # the module graph unused. A graph scan of this repository would drown the
      # real findings in test-only dependencies of the standard library.
      - name: Check reachable vulnerabilities
        working-directory: core
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  osv:
    name: Advisory database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The action image brings the Go toolchain for osv-scanner's call
      # analysis (govulncheck), and it has to be at least the go line of
      # core/go.mod: v2.3.1 shipped Go 1.25.5, could not load the module,
      # and failed the job even on advisories the core never reaches.
      # v2.7.0 runs on Go 1.27.1.
      - uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          # osv-scanner 2 reads Go dependencies from go.mod; go.sum alone has no
          # extractor, and --skip-gitignore no longer exists.
          scan-args: |-
            --lockfile=go.mod:core/go.mod

  codeql:
    name: Static analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ['go']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@d0bae162f31f17dd92c46ccdc4dfee5710f8dc67 # v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - name: Analyze
        uses: github/codeql-action/analyze@d0bae162f31f17dd92c46ccdc4dfee5710f8dc67 # v3
        with:
          category: '/language:${{ matrix.language }}'

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      # Fails the pull request on a licence that the project does not ship, on a
      # dependency with a known advisory, or on a package that is not from a
      # source the project trusts.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Look for credentials in the tree
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cross-build:
    name: Core builds everywhere
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/go.mod
          cache: false

      # The core is compiled for every platform it ships on, because a package
      # that only builds on the machine of its author is a package that ships
      # broken. This is the check the local machine cannot replace.
      - name: Build every target
        working-directory: core
        run: |
          set -euo pipefail
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            goos="${target%%/*}"
            goarch="${target##*/}"
            echo "== $goos/$goarch"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build ./...
          done

      - name: Build with the race detector
        working-directory: core
        run: go test -race -count=1 ./...
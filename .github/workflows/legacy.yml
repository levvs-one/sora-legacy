name: Sora Legacy

on:
  push:
    branches: [legacy]
    paths:
      - 'legacy/**'
      - 'core/**'
      - 'proto/**'
      - 'packaging/**'
      - 'service/**'
      - 'tools/**'
      - '.github/workflows/legacy.yml'
  pull_request:
    branches: [legacy]
    paths:
      - 'legacy/**'
      - 'core/**'
      - 'proto/**'
      - 'packaging/**'
      - 'service/**'
      - 'tools/**'
      - '.github/workflows/legacy.yml'

permissions:
  contents: read

concurrency:
  group: legacy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Legacy core and workflow checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/go.mod
          cache: false
      - name: Check workflows
        # actionlint is fetched as a release archive and verified by SHA-256
        # instead of executing a remote install script (supply-chain hardening).
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint_1.7.7_linux_amd64.tar.gz"
          curl -sSfL -o "$archive" https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          printf '%s  %s\n' '023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757' "$(basename "$archive")" > "$archive.sha256"
          (cd "$RUNNER_TEMP" && sha256sum -c "$archive.sha256")
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: Sync-check payload engine pins against the catalog floor
        # engines.lock (what the packages ship) must never fall below
        # the MinVersion floors in core/engine/catalog.go (what the
        # core accepts at load). Semantic comparison; an architecture
        # split or a missing engine fails too. Local equivalent:
        #   python3 tools/check-engine-pins.py
        run: python3 tools/check-engine-pins.py
      - name: Check formatting and static errors
        working-directory: core
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
      - name: Test the core with the race detector
        working-directory: core
        run: go test -race ./...
      - name: ARB parity pin (legacy Client locales)
        # The executable pin for the Client ARB files: identical key
        # sets in all 31 locales, languages.json in sync, and every
        # key the C# code requests present in app_en.arb. It also runs
        # inside the full test suite above; the explicit step names
        # the gate so a parity break is visible as its own failure.
        # Local equivalent:
        #   cd core && go test ./control/ -run TestARBMirrorLocalesLanguagesAndCodeKeys -count=1 -v
        working-directory: core
        run: go test ./control/ -run TestARBMirrorLocalesLanguagesAndCodeKeys -count=1 -v
      - name: Benchmark allocation gate
        # Allocation-regression gate over every baselined benchmark
        # (tools/bench-baseline.txt); B/op and allocs/op only, ns/op
        # is deliberately not gated (see the script header).
        # Local equivalent:
        #   tools/bench-baseline.sh
        run: tools/bench-baseline.sh
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: core

  linux-packages:
    name: Legacy Linux packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/go.mod
          cache: false
      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential zlib1g-dev libcap-dev libnetfilter-queue-dev libnfnetlink-dev libmnl-dev rpm zstd
      - name: Install nfpm
        # nfpm is fetched as a release archive and verified by SHA-256
        # instead of executing a remote install script (same supply-chain
        # hardening as actionlint in the core job above).
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/nfpm_2.48.0_Linux_x86_64.tar.gz"
          curl -sSfL -o "$archive" https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_Linux_x86_64.tar.gz
          printf '%s  %s\n' '6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750' "$(basename "$archive")" > "$archive.sha256"
          (cd "$RUNNER_TEMP" && sha256sum -c "$archive.sha256")
          sudo tar -xzf "$archive" -C /usr/local/bin nfpm
          nfpm --version
      - name: Build the core service
        run: |
          cd core && CGO_ENABLED=0 GOARCH=amd64 go build -trimpath -ldflags '-s -w' -o ../dist/sora-core ./cmd/sora-core
          cd macos/helper && CGO_ENABLED=0 GOARCH=amd64 go build -trimpath -ldflags '-s -w' -o ../../dist/sora-ctl .
      - name: Fetch engines and build zapret
        run: |
          packaging/engines/fetch.sh amd64 dist/engines
          packaging/zapret/build.sh dist/engines
      - name: Build deb, rpm and Arch packages
        run: |
          for packager in deb rpm archlinux; do
            SORA_ARCH=amd64 SORA_VERSION=0.2.4 nfpm package --config packaging/linux/nfpm.yaml --packager "$packager" --target dist/
          done
      - name: Verify package contents
        run: |
          set -euo pipefail
          dpkg-deb -c dist/*.deb > "$RUNNER_TEMP/deb.list"
          rpm -qlp dist/*.rpm > "$RUNNER_TEMP/rpm.list"
          tar --zstd -tf dist/*.pkg.tar.* > "$RUNNER_TEMP/arch.list"
          for list in deb rpm arch; do
            grep -q 'usr/bin/sora-core' "$RUNNER_TEMP/$list.list"
            grep -q 'usr/bin/sora-ctl' "$RUNNER_TEMP/$list.list"
            grep -q 'usr/lib/sora/engines/SHA256SUMS' "$RUNNER_TEMP/$list.list"
            grep -q 'usr/lib/sora/engines/sing-box' "$RUNNER_TEMP/$list.list"
            grep -q 'usr/lib/sora/engines/tpws' "$RUNNER_TEMP/$list.list"
            grep -q 'usr/lib/systemd/system/sora-core.service' "$RUNNER_TEMP/$list.list"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sora-legacy-linux-packages-amd64
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.*
          if-no-files-found: error

  control-windows:
    name: Legacy RPC (${{ matrix.platform }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: '386'
            platform: x86
          - arch: amd64
            platform: x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Bootstrap Go for the win7 SDK build; the win7 toolchain itself is
          # pinned by archive hash and VERSION check below.
          go-version-file: core/go.mod
          cache: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.424
      - name: Parse-check the local Windows 7 build script
        shell: pwsh
        run: |
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'legacy/build/Build-CoreWin7.ps1').Path, [ref]$null, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { $parseErrors | Out-String | Write-Error; exit 1 }
      - name: Build verified Windows 7 SDK
        shell: pwsh
        run: |
          $env:GOROOT_BOOTSTRAP = go env GOROOT
          $sdk = Join-Path $env:RUNNER_TEMP 'go-win7-1.26.9'
          $archive = Join-Path $env:RUNNER_TEMP 'go-win7.zip'
          Invoke-WebRequest 'https://github.com/XTLS/go-win7/releases/download/current/go-win7-win6-1.26.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '4a8ea74640bcdf608fbe351b3eaa5715685b18ec0b0d27e8d59608ade86c8397') { throw 'Unverified Go SDK source' }
          Expand-Archive $archive $sdk
          if ((Get-Content "$sdk\VERSION" -First 1) -ne 'go1.26.9') { throw 'Unexpected Go SDK version' }
          $env:CGO_ENABLED = '0'
          $env:GOTOOLCHAIN = 'local'
          Push-Location "$sdk\src"
          try { cmd /c make.bat; if ($LASTEXITCODE -ne 0) { throw 'Windows 7 SDK build failed' } }
          finally { Pop-Location }
          "$sdk\bin" >> $env:GITHUB_PATH
          "GOROOT=$sdk" >> $env:GITHUB_ENV
          'GOTOOLCHAIN=local' >> $env:GITHUB_ENV
      - name: Build .NET Framework control client
        run: |
          dotnet build legacy/tests/ControlInterop/ControlInterop.csproj -c Release -p:PlatformTarget=${{ matrix.platform }} --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Control client build failed' }
          dotnet build legacy/tests/ServiceInterop/ServiceInterop.csproj -c Release -p:PlatformTarget=${{ matrix.platform }} --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Service client build failed' }
          dotnet build legacy/tests/ClientInterop/ClientInterop.csproj -c Release -p:PlatformTarget=${{ matrix.platform }} --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Legacy GUI build failed' }
      - name: Exercise native named pipes and x86 ABI
        working-directory: core
        env:
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        shell: pwsh
        run: |
          $env:SORA_INTEROP_CLIENT = (Resolve-Path '../legacy/tests/ControlInterop/bin/Release/net48/ControlInterop.exe').Path
          go test -v ./legacycontrol ./ipc ./diagnostics ./cmd/sora-core
          if ($LASTEXITCODE -ne 0) { throw 'Legacy contract failed' }
          go build -trimpath -ldflags '-s -w -X main.buildVersion=legacy-dev' -o ../legacy/artifacts/sora-legacy-core-${{ matrix.platform }}.exe ./cmd/sora-core
          if ($LASTEXITCODE -ne 0) { throw 'Legacy core build failed' }
      - name: Verify the service from an ordinary Windows account
        shell: pwsh
        run: |
          $core = (Resolve-Path 'legacy/artifacts/sora-legacy-core-${{ matrix.platform }}.exe').Path
          $client = (Resolve-Path 'legacy/tests/ServiceInterop/bin/Release/net48/ServiceInterop.exe').Path
          $gui = (Resolve-Path 'legacy/tests/ClientInterop/bin/Release/net48/ClientInterop.exe').Path
          $data = Join-Path $env:RUNNER_TEMP 'sora-legacy-service-data'
          $checks = Join-Path $env:RUNNER_TEMP 'sora-legacy-user-checks'
          New-Item -ItemType Directory $checks | Out-Null
          $script = Join-Path $checks 'sora-legacy-user.ps1'
          $result = Join-Path $checks 'sora-legacy-user-result.txt'
          $output = Join-Path $checks 'sora-legacy-user-output.txt'
          try {
            & $core --install-service --data-dir $data
            if ($LASTEXITCODE -ne 0) { throw 'Legacy service installation failed' }
            Stop-Service SoraLegacyCore
            & $client --spoof
            if ($LASTEXITCODE -ne 0) { throw 'Legacy pipe spoof was not rejected' }
            Start-Service SoraLegacyCore
            foreach ($path in @((Split-Path $client), (Split-Path $gui), $checks)) {
              & icacls.exe $path /grant '*S-1-5-32-545:(OI)(CI)M' /T /Q | Out-Null
              if ($LASTEXITCODE -ne 0) { throw 'Cannot prepare ordinary-user test outputs' }
            }
            @"
          & '$client' *> '$output'
          if (`$LASTEXITCODE -ne 0) { `$LASTEXITCODE | Set-Content '$result'; exit }
          & '$gui' '$checks' *>> '$output'
          `$LASTEXITCODE | Set-Content '$result'
          "@ | Set-Content $script
            Start-Service seclogon
            & runas.exe /trustlevel:0x20000 "powershell.exe -NoProfile -ExecutionPolicy Bypass -File `"$script`""
            for ($i = 0; $i -lt 150 -and -not (Test-Path $result); $i++) { Start-Sleep -Seconds 1 }
            Get-Content $output -ErrorAction SilentlyContinue
            if (-not (Test-Path $result) -or (Get-Content $result) -ne '0') {
              throw 'The ordinary Windows user cannot reach SoraLegacyCore'
            }
          } finally {
            & $core --uninstall-service
            if ($LASTEXITCODE -ne 0) { throw 'Legacy service removal failed' }
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sora-legacy-core-${{ matrix.platform }}
          path: legacy/artifacts/sora-legacy-core-${{ matrix.platform }}.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sora-legacy-client-development-${{ matrix.platform }}
          path: |
            legacy/Client/bin/Release/net48
            ${{ runner.temp }}/sora-legacy-user-checks
          if-no-files-found: error

  windows-x86:
    name: ${{ matrix.executable }}
    runs-on: windows-latest
    defaults:
      run:
        working-directory: legacy
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win7
            executable: sora_win7.exe
          - target: win8
            executable: sora_win8.exe
          - target: win10
            executable: sora_win10.exe
          - target: win11
            executable: sora_win11.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.424
      - name: Restore
        run: dotnet restore v2rayN\v2rayN\v2rayN.csproj --runtime win7-x86
      - name: Build
        run: dotnet build v2rayN\v2rayN\v2rayN.csproj --configuration Release --runtime win7-x86 --no-restore --property:Platform=x86 --property:SoraWindowsTarget=${{ matrix.target }}
      - name: Subscription regression
        shell: powershell
        run: |
          & "$env:WINDIR\SysWOW64\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File tests\Sora.SubscriptionRegression.ps1 -SoraExe "v2rayN\v2rayN\bin\x86\Release\net48\win7-x86\${{ matrix.executable }}"
      - name: Windows 7 QA script compatibility
        shell: powershell
        run: |
          $powershell = "$env:WINDIR\SysWOW64\WindowsPowerShell\v1.0\powershell.exe"
          foreach ($script in @(
            'tests\Sora.Dogfood.ps1',
            'tests\Sora.LiveSubscriptionQa.ps1',
            'tests\Sora.LocalVpnPlumbing.ps1',
            'tests\Sora.RealLatencyQa.ps1'
          )) {
            $env:SORA_QA_SCRIPT = (Resolve-Path $script).Path
            & $powershell -NoProfile -Command '$parseErrors = $null; [System.Management.Automation.Language.Parser]::ParseFile($env:SORA_QA_SCRIPT, [ref]$null, [ref]$parseErrors) | Out-Null; if ($parseErrors.Count) { $parseErrors | Out-String | Write-Error; exit 1 }'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sora-legacy-${{ matrix.target }}-x86
          path: legacy\v2rayN\v2rayN\bin\x86\Release\net48\win7-x86
          if-no-files-found: error

# Engine builds the macOS service ships, one line per engine and
# architecture, in the format of packaging/engines/engines.lock:
#   engine  arch  sha256  url
# Versions are the SERVICE pins of packaging/engines/engines.lock
# (sing-box 1.14.3 / Xray 26.3.27 / mihomo 1.19.32) — not the Windows
# payload pins (D4/LEGACY-FLOORS-FIX records the divergence).
#
# Every digest below was measured 2026-10-22 from the real downloaded
# artifact AND cross-checked: Xray against the release's official
# .dgst (SHA2-256 matches byte for byte), sing-box and mihomo against
# the digest the GitHub API publishes for the release asset.
#
# The "min macOS" notes are also measured, from each binary's Mach-O
# LC_BUILD_VERSION / LC_VERSION_MIN_MACOSX load command — they decide
# which engines can even launch on a given system, and the capability
# matrix in README.md is built from them:
#
#   sing-box amd64: the LEGACY asset is pinned on purpose. Upstream's
#     regular darwin builds of 1.14.3 declare min macOS 26.0; the
#     legacy-macos-10.13 build declares 10.13 and is the only sing-box
#     that runs on the systems this client targets.
#   sing-box arm64: no legacy asset exists upstream; the regular build
#     declares min macOS 26.0. On Apple Silicon below macOS 26 the
#     core honestly has no sing-box — Xray and mihomo carry the plans
#     they can, and the core's engine selection says so.
#   xray: min macOS 12.0 on both architectures (matches the daemon's
#     own floor — see README.md).
#   mihomo: min macOS 10.13 (amd64) / 11.0 (arm64).
